seed: 20260930
spectral_grid_step_um: 0.005
candidate_step_um: 0.02
analysis_range_um: [0.4, 40.0]
band_counts: [4, 5, 6, 8, 10, 12, 16, 20]
spacing_factors: [1.0, 2.0, 4.0]
reference_band_count: 8
reference_spacing_factor: 1.0
monte_carlo_trials: 300

# These are sensitivity cases, not flight-instrument predictions. The VNIR
# endpoints are bracketed by published M3 polar/equatorial performance; the
# MIR/FIR values deliberately span a broad design envelope.
noise_profiles:
  optimistic:
    vnir_snr: 400
    mir_snr: 200
    fir_snr: 100
  reference:
    vnir_snr: 200
    mir_snr: 100
    fir_snr: 50
  stressed:
    vnir_snr: 100
    mir_snr: 50
    fir_snr: 20

stress_tests:
  nominal:
    noise_profile: reference
    center_shift_fwhm: 0.0
    continuum_sigma: 0.0
  calibration:
    noise_profile: reference
    center_shift_fwhm: 0.10
    continuum_sigma: 0.02
  combined:
    noise_profile: stressed
    center_shift_fwhm: 0.25
    continuum_sigma: 0.05

